agent:
  version: 1
runtime:
  default: host
services:
  web:
    url: http://127.0.0.1:3000
    healthcheck: http://127.0.0.1:3000
  api:
    url: http://127.0.0.1:9000
    healthcheck: http://127.0.0.1:9000/docs
commands:
  setup: ./.agent/hooks/setup
  start: ./.agent/hooks/start
  wait: ./.agent/hooks/wait
  stop: ./.agent/hooks/stop
scenarios:
  default: {}
